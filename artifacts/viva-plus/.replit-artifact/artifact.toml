kind = "web"
previewPath = "/"
title = "Viva+"
version = "1.0.0"
id = "artifacts/viva-plus"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5000

[services.env]
PORT = "5000"

[services.development]
run = "sh -c 'cd /home/runner/workspace && npm run dev'"

[services.production]
build = [ "sh", "-c", "cd /home/runner/workspace && npm run build" ]
run = [ "sh", "-c", "cd /home/runner/workspace && node server.js" ]